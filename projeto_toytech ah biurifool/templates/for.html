{% extends 'sidebar.html' %}

{% block conteudo %}
<h2>{{ 'Editar Fornecedor' if fornecedor and fornecedor.id else 'Cadastrar Fornecedor' }}</h2>
<div class="body-cadastro">

    <div class="container d-flex align-items-center justify-content-center cadastro-container">
        <div class="cadastro-card text-center mt-4">
            <h3 class="mb-3 text-white">CADASTRO DE FORNECEDOR</h3>

            <form method="POST"action="{% if fornecedor and fornecedor.id %}{{ url_for('salvar_fornecedor','atualizar_fornecedor', id=fornecedor.id) }}{% else %}{{ url_for('salvar_fornecedor') }}{% endif %}">
                <div class="mb-3 text-start"> <label class="form-label text-white">Nome</label>
                    <div class="input-group"> <span class="input-group-text "><i class="bi text-white"></i></span>
                        <input type="text" id="name" name="nome" class="form-control-cad" value="{{ fornecedor.nome if fornecedor else '' }}" required>
                    </div>
                </div>
                <div class="mb-3 text-start"> <label class="form-label text-white">CNPJ</label>
                    <div class="input-group"> <span class="input-group-text "><i class="bi  text-white"></i> </span>
                        <input type="text" id="cnpj" name="cnpj" class="form-control-cad" value="{{ fornecedor.cnpj if fornecedor else '' }}"required>
                    </div>
                </div>
                <div class="mb-3 text-start"> <label class="form-label text-white">Telefone</label>
                    <div class="input-group"> <span class="input-group-text "><i class="bi  text-white"></i> </span>
                        <input type="tel" id="tel" name="telefone" class="form-control-cad" value="{{ fornecedor.telefone if fornecedor else '' }}" required>
                    </div>
                </div>
                <button class="btn btn-cad w-100 text-white mt-2" type="submit">Cadastrar</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
