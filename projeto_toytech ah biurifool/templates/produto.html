{% extends 'sidebar.html' %}

{% block conteudo %}
<h2>{{ 'Editar Produto' if produto and produto.id else 'Cadastrar Produto' }}</h2>

<div class="body-cadastro">

    <div class="container d-flex align-items-center justify-content-center cadastro-container">
        <div class="cadastro-card text-center mt-4">
            <h3 class="mb-3 text-white">CADASTRO DE PRODUTOS</h3>

            <form method="POST" action="{% if produto and produto.id %}{{ url_for('salvar_produto','atualizar_produto', id=produto.id)}}{% else %}{{url_for('salvar_produto')}}{% endif %}">
                <div class="mb-3 text-start"> <label class="from-label text-white">Nome</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi text-white"></i>
                        </span> <input type="text" id="produto_nome" name="nome" class="form-control-cad" value="{{ produto.nome if produto else ''}}"  required> </div>
                </div>

                <div class="mb-3 text-start"> <label class="from-label text-white">Descrição</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi  text-white"></i> </span>
                        <input type="text" id="produto_descricao"  name="descricao" class="form-control-cad" value="{{ produto.descricao if produto else ''}}" required>
                    </div>
                </div>

                <div class="mb-3 text-start"> <label class="from-label text-white">Fornecedor</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi  text-white"></i> </span>
                        <input type="text" id="fornecedor_id" name="fornecedor" class="form-control-cad" value="{{ produto.fornecedor if produto else ''}}" required>
                    </div>
                </div>

                <div class="mb-3 text-start"> <label class="from-label text-white">Localização</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi  text-white"></i> </span>
                        <input type="text" name="localizacao_produto" class="form-control-cad" value="{{ produto.localizacao if produto else ''}}" required>
                    </div>
                </div>

                <div class="mb-3 text-start"> <label class="from-label text-white">Imagem</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi  text-white"></i> </span>
                        <input type="text" id="produto_imagem" name="imagem" class="form-control-cad" value="{{ produto.imagem if produto else ''}}" required>
                    </div>
                </div>

                <div class="mb-3 text-start"> <label class="from-label text-white">Preço</label>
                    <div class="input-group"> <span class="input-group-text "> <i class="bi  text-white"></i> </span>
                        <input type="text"  id="produto_preco" name="preco" class="form-control-cad" value="{{ produto.preco if produto else ''}}"required>
                    </div>
                </div>

                <button class="btn btn-cad w-100 text-white mt-2" type="submit">Cadastrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
